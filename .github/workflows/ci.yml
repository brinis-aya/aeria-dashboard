name: CI and Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # started by the daily data refresh

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Build for GitHub Pages
        run: npm run build
        env:
          PAGES_BASE: /aeria-dashboard/
      - name: Accessibility (axe-core, WCAG 2.1 AA) on every page
        run: |
          npm install --no-save @playwright/test@1.49.1 @axe-core/playwright@4.10.1
          npx playwright install --with-deps chromium
          PAGES_BASE=/aeria-dashboard/ npx vite preview --port 4173 &
          for i in $(seq 1 30); do curl -sf http://localhost:4173/aeria-dashboard/ > /dev/null && break; sleep 2; done
          npx playwright test e2e
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
